<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仕訳クエスト 簿記3級</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECF0EA; --sheet:#FBFCF9; --rule:#D3DCD2; --rule2:#B9C6B9;
  --ink:#1B2236; --sub:#596377; --dr:#2556B5; --cr:#C43D28; --gold:#C9981C; --ok:#2B8350;
  --btn:#1B2236; --btnink:#FBFCF9; --btnedge:#05070E;
  --night:#141A35; --night2:#2B3670; --wink:#EEF1FA; --winbg:#10152C;
  --hpHi:#4CC47E; --hpMid:#E8C04F; --hpLo:#EE6A52;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1120; --sheet:#161C31; --rule:#262F4C; --rule2:#36406A;
    --ink:#E6EAF4; --sub:#98A2BA; --dr:#7DA4F4; --cr:#F2846D; --gold:#E8C04F; --ok:#5CC88C;
    --btn:#E8C04F; --btnink:#141A35; --btnedge:#8A6A12;
    --night:#0B0F22; --night2:#1F2856; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1120; --sheet:#161C31; --rule:#262F4C; --rule2:#36406A;
  --ink:#E6EAF4; --sub:#98A2BA; --dr:#7DA4F4; --cr:#F2846D; --gold:#E8C04F; --ok:#5CC88C;
  --btn:#E8C04F; --btnink:#141A35; --btnedge:#8A6A12;
  --night:#0B0F22; --night2:#1F2856; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
main{max-width:600px;margin:0 auto;padding:12px 14px 56px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.px{font-family:"DotGothic16","MS Gothic",monospace;letter-spacing:.03em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:8px;font-weight:800;font-size:16px;background:var(--btn);color:var(--btnink);box-shadow:0 4px 0 var(--btnedge);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnedge)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--rule2)}
.btn.ghost:active{transform:translateY(1px)}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.topnav{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-bottom:6px}
.back{color:var(--sub);font-size:14px;padding:8px 2px}
.back::before{content:"‹ ";font-size:18px}

/* night stage */
.stage{border-radius:14px;overflow:hidden;background:var(--night);color:var(--wink);position:relative;margin-bottom:14px}
.sky{position:relative;padding:14px 14px 0;background:
  radial-gradient(1.6px 1.6px at 8% 22%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 23% 64%,#ffffffb0 50%,transparent 52%),
  radial-gradient(1.8px 1.8px at 41% 14%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 62% 40%,#ffffffa0 50%,transparent 52%),
  radial-gradient(1.6px 1.6px at 78% 18%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 91% 56%,#ffffffb0 50%,transparent 52%),
  radial-gradient(1.4px 1.4px at 55% 72%,#ffffff80 50%,transparent 52%),
  linear-gradient(180deg,var(--night) 0%,var(--night2) 100%)}
.ground{height:22px;background:repeating-linear-gradient(90deg,#3E6440 0 12px,#355837 12px 24px);border-top:4px solid #68A05A;box-shadow:inset 0 -6px 0 #2A4430}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#C3CAE6}
.hud .power{color:#F3CF63;letter-spacing:1px}
.win{background:var(--winbg);border:3px solid var(--wink);border-radius:6px;box-shadow:0 0 0 3px var(--winbg);margin:10px 12px 0;padding:8px 12px}
.win:last-child{margin-bottom:14px}

/* title */
.title-sky{padding:22px 18px 0;text-align:center}
.logo{margin:6px 0 0;font-family:"DotGothic16",monospace;font-weight:400;font-size:clamp(46px,14vw,72px);line-height:1.02;color:#FFF3CF;text-shadow:3px 3px 0 #C43D28,6px 6px 0 #05070E;letter-spacing:.04em}
.tagline{margin:12px 0 0;font-size:14px;color:#C3CAE6}
.lineup{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-top:14px;height:74px}
.lineup .bob{width:56px;height:56px}
.lineup .bob:nth-child(3){width:74px;height:74px}
.lineup svg{width:100%;height:100%;display:block}
.cmd{padding:6px 6px}
.cmd-i{display:grid;grid-template-columns:22px 1fr auto;align-items:center;width:100%;text-align:left;padding:10px 8px;border-radius:4px;color:var(--wink)}
.cmd-i::before{content:"▶";color:#F3CF63;font-size:13px;opacity:0;transition:opacity .1s}
.cmd-i:hover::before,.cmd-i:focus-visible::before{opacity:1}
.cmd:not(:hover):not(:focus-within) .cmd-i:first-child::before{opacity:1}
.cmd-i:hover,.cmd-i:focus-visible{background:#1D2448;outline:none}
.cmd-i b{font-family:"DotGothic16",monospace;font-weight:400;font-size:22px;display:block;line-height:1.3}
.cmd-i span{font-size:13px;color:#AEB6D6;display:block}
.cmd-i em{font-style:normal;font-size:12px;color:#F3CF63;text-align:right;padding-left:8px}
.homefoot{font-size:13px;color:var(--sub);text-align:center;margin:4px 0 0}

/* battle */
.foe{display:grid;place-items:center;height:132px;position:relative}
.foe .bob{width:120px;height:120px}
.foe svg{width:100%;height:100%;display:block}
.bob{animation:bob 1.6s steps(4) infinite}
.lineup .bob:nth-child(2n){animation-delay:-.8s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hit{animation:hit .42s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}15%{filter:brightness(3)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.down{animation:down .7s forwards}
@keyframes down{to{opacity:0;transform:translateY(16px) scaleY(.4)}}
.hurt{animation:hurt .5s}
@keyframes hurt{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}}
.flash::after{content:"";position:absolute;inset:0;background:#EE2B12;opacity:0;animation:flash .45s;pointer-events:none}
@keyframes flash{30%{opacity:.35}}
.fx{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;left:50%;top:44%;transform:translate(-50%,0);font-family:"DotGothic16",monospace;font-size:40px;color:#FFF3CF;text-shadow:3px 3px 0 #C43D28,-2px -2px 0 #05070E,2px -2px 0 #05070E,-2px 2px 0 #05070E;animation:pop 1s forwards;white-space:nowrap}
.pop.crit{font-size:50px;color:#FFE27A}
.pop.me{top:70%;color:#FFD2C8;text-shadow:3px 3px 0 #05070E}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:"DotGothic16",monospace;font-size:clamp(32px,10vw,46px);color:#FFF3CF;text-shadow:3px 3px 0 #C43D28,5px 5px 0 #05070E;animation:banner .5s steps(5)}
@keyframes banner{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.who{display:flex;justify-content:space-between;font-family:"DotGothic16",monospace;font-size:15px;line-height:1.4}
.who span:last-child{font-variant-numeric:tabular-nums;color:#C3CAE6}
.hp{height:12px;border:2px solid var(--wink);border-radius:3px;background:#2A2F4D;margin:2px 0 7px;position:relative;overflow:hidden}
.hp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#10152C 9px 11px)}
.hp i{display:block;height:100%;width:100%;background:var(--hpHi);transition:width .5s steps(8)}
.hp i[data-l="mid"]{background:var(--hpMid)} .hp i[data-l="lo"]{background:var(--hpLo)}
.hp.foe-hp i{background:#EE6A52}
.clock{display:grid;grid-template-columns:auto 1fr 2.2em;gap:8px;align-items:center;font-size:12px;color:#C3CAE6}
.clock span:last-child{font-family:"DotGothic16",monospace;font-size:15px;text-align:right;color:var(--wink);font-variant-numeric:tabular-nums}
.tbar{height:6px;background:#2A2F4D;border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:#F3CF63}
.tbar i.low{background:#EE6A52}
.msg{font-family:"DotGothic16",monospace;font-size:16px;line-height:1.55;min-height:52px;position:relative;padding-right:26px}
.msg::after{content:"▼";position:absolute;right:10px;bottom:6px;font-size:11px;color:#F3CF63;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* journal slip */
.slip{position:relative;background:var(--sheet);border-radius:4px;box-shadow:0 0 0 1px var(--rule2),0 6px 0 -2px var(--rule);padding:16px 14px 18px}
.slip-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding-bottom:8px;border-bottom:2px solid var(--ink)}
.lv{font-weight:700;color:var(--ink);white-space:nowrap}
.lv .st{color:var(--gold);letter-spacing:1px}
.qtext{font-size:17px;font-weight:500;line-height:1.75;margin:12px 0 16px;min-height:3.5em}
.jt{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:2px}
.jh{text-align:center;font-weight:800;font-size:15px;padding:6px 0;border-bottom:2px solid var(--ink)}
.jh.d{color:var(--dr)} .jh.c{color:var(--cr);border-left:2px solid var(--ink)}
.cell{padding:8px 7px;border-bottom:1px solid var(--rule);min-width:0;display:grid;gap:6px;align-content:start}
.cell.c{border-left:2px solid var(--ink)}
.cell.blank{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--rule) 8px 9px)}
.acct{width:100%;min-height:42px;border-radius:6px;border:1.5px dashed var(--rule2);color:var(--sub);font-size:15px;padding:4px 6px;text-align:center;line-height:1.3}
.acct.set{border-style:solid;color:var(--ink);font-weight:700;background:var(--paper)}
.cell.d .acct.set{border-color:var(--dr)} .cell.c .acct.set{border-color:var(--cr)}
.amt{display:flex;align-items:center;border-bottom:1.5px solid var(--rule2);padding:0 2px}
.amt span{color:var(--sub);font-size:13px}
.amt input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:700;text-align:right;padding:6px 0;font-variant-numeric:tabular-nums}
.amt input:focus{outline:none}
.amt:focus-within{border-bottom-color:var(--gold);box-shadow:0 2px 0 var(--gold)}
.jf{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:6px 8px;border-top:2px solid var(--ink);font-variant-numeric:tabular-nums}
.jf b{color:var(--ink);font-size:15px}
.jf.c{border-left:2px solid var(--ink)}
.cell.good .acct,.cell.good .amt{border-color:var(--ok)}
.cell.bad{background:color-mix(in srgb,var(--cr) 9%,transparent)}
.bal{font-size:13px;color:var(--sub);text-align:center;margin:8px 0 0;min-height:1.7em}
.bal.ok{color:var(--ok);font-weight:700}
.slip-a{margin-top:14px}
.jt{position:relative}
.stamp{position:absolute;bottom:-26px;right:10px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:4px solid currentColor;color:var(--cr);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:800;font-size:22px;line-height:1.1;text-align:center;transform:rotate(-12deg);opacity:.88;animation:stamp .32s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.stamp::before{content:"";position:absolute;inset:4px;border:1.5px solid currentColor;border-radius:50%}
.stamp.ng{color:var(--dr)}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.8);opacity:0}}
.res{margin-top:16px;border-top:1px dashed var(--rule2);padding-top:12px}
.res h3{font-size:14px;margin:0 0 6px;color:var(--sub);font-weight:700}
.ans{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;margin-bottom:12px}
.ans th{font-size:13px;padding:4px 6px;border-bottom:2px solid var(--ink)}
.ans th.d{color:var(--dr);text-align:left} .ans th.c{color:var(--cr);text-align:left;border-left:2px solid var(--ink)}
.ans td{padding:5px 6px;border-bottom:1px solid var(--rule)}
.ans td.n{text-align:right;font-weight:700}
.ans td.c1{border-left:2px solid var(--ink)}
.exp{margin:0;font-size:15px;line-height:1.75}
.next{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.next .btn{flex:1}

/* compact sticky battle header (mobile-first) */
.bhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:-12px -14px 12px;padding:8px 12px 10px;color:var(--wink);border-radius:0 0 14px 14px;box-shadow:0 4px 0 #05070E40}
body.battle::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.bh-top{display:flex;align-items:center;gap:10px;font-size:12px;color:#C3CAE6;min-height:30px}
.bh-top .back{color:#C3CAE6;font-size:13px;padding:4px 6px 4px 0}
.bh-top .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-top .power{color:#F3CF63;letter-spacing:1px}
.skip{flex:none;font-size:12px;color:var(--wink);padding:4px 10px;border-radius:999px;box-shadow:inset 0 0 0 1.5px #C3CAE6;min-height:28px}
.skip:active{background:#ffffff22}
.skip:disabled{opacity:.4}
.bh-main{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;margin-top:2px}
.bh-foe{height:84px;display:grid;place-items:end center;border-bottom:3px solid #68A05A;background:linear-gradient(transparent calc(100% - 8px),#3E6440 0)}
.bh-foe .bob{width:70px;height:70px;margin-bottom:2px}
.bh-foe svg{width:100%;height:100%;display:block}
.bh-stats .who{font-size:13px}
.bh-stats .hp{height:10px;margin:1px 0 5px}
.bh-stats .clock{margin-top:2px}
.bhead .msg{margin:8px 0 0;padding:6px 26px 6px 10px;font-size:14px;min-height:calc(2 * 1.55em + 12px);background:var(--winbg);border:3px solid var(--wink);border-radius:6px}
.bhead .pop{left:54px;top:40px;font-size:32px}
.bhead .pop.crit{font-size:40px}
.bhead .pop.me{left:68%;top:44px;font-size:28px}
.bhead .banner{top:34%;font-size:clamp(28px,9vw,40px)}
.bhead .duel{margin-top:4px}
#duel .pop{left:80%;top:30px}
#duel .pop.me{left:22%;top:30px}
.slip-a,.next{position:sticky;bottom:0;z-index:4;background:var(--sheet);margin-left:-14px;margin-right:-14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.slip-a{margin-bottom:-18px;margin-top:12px}
.next{margin-bottom:-18px}
@media (max-height:720px){
  .logo{font-size:clamp(38px,11vw,52px)}
  .title-sky{padding-top:14px}
  .lineup{height:54px;margin-top:8px}.lineup .bob{width:42px;height:42px}.lineup .bob:nth-child(3){width:54px;height:54px}
  .cmd-i{padding:6px 8px}.cmd-i b{font-size:19px}
  .qtext{font-size:16px;margin:8px 0 12px;min-height:0}
  .slip{padding-top:12px}
  .acct{min-height:38px}
}

.amtbtn{width:100%;min-height:42px;border-radius:6px;border:1.5px dashed var(--rule2);color:var(--sub);font-size:15px;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
.amtbtn.set{border-style:solid;color:var(--ink);font-weight:800;font-size:16px;background:var(--paper)}
.cell.d .amtbtn.set{border-color:var(--dr)} .cell.c .amtbtn.set{border-color:var(--cr)}
.cell.good .amtbtn{border-color:var(--ok)}
.picks.num .pick{font-variant-numeric:tabular-nums;font-size:16px;text-align:right;padding-right:14px}
.cf-t{margin:6px 2px 4px;font-size:16px;font-weight:700;line-height:1.7}
.next.cf{position:static;margin:12px 0 0;padding:0;border:0;background:none}
.clearpick{display:block;width:100%;margin-top:10px;min-height:44px;color:var(--sub);font-size:14px;border-radius:8px}
.opts+.tprev{margin-top:14px}

/* options */
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--rule2)}
.opt b{display:block;font-size:16px}
.opt small{display:block;font-size:13px;color:var(--sub);line-height:1.5}
.dotr{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--rule2)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2.5px var(--gold);background:var(--paper)}
.opt[aria-checked="true"] .dotr{box-shadow:inset 0 0 0 6px var(--gold)}
.tprev{display:grid;grid-template-columns:repeat(5,1fr);margin-top:14px;border-radius:4px;box-shadow:0 0 0 1px var(--rule2)}
.tprev div{text-align:center;padding:8px 2px}
.tprev div+div{border-left:1px solid var(--rule)}
.tprev small{display:block;font-size:11px;color:var(--sub)}
.tprev b{font-family:"DotGothic16",monospace;font-weight:400;font-size:17px}
.clock .nolimit{grid-column:2/4;text-align:right;font-family:"DotGothic16",monospace;font-size:14px;color:var(--wink)}

/* picker sheet */
.sheet-ov{position:fixed;inset:0;background:#05070E99;display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;transition:opacity .15s}
.sheet-ov.open{opacity:1}
.sheet{width:100%;max-width:600px;background:var(--sheet);border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow:auto;transform:translateY(20px);transition:transform .18s}
.sheet-ov.open .sheet{transform:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-h b{font-size:16px}
.sheet-h b.d{color:var(--dr)} .sheet-h b.c{color:var(--cr)}
.x{width:40px;height:40px;border-radius:50%;font-size:22px;color:var(--sub)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{min-height:50px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--rule2);font-weight:700;font-size:15px;padding:4px 8px}
.pick.on{box-shadow:inset 0 0 0 2.5px var(--gold);background:var(--paper)}
.pick:active{background:var(--paper)}

/* page heads */
.pagehead h1{font-family:"DotGothic16",monospace;font-weight:400;font-size:34px;line-height:1.2;margin:4px 0 4px}
.pagehead p{margin:0 0 16px;color:var(--sub);font-size:14px}
.report{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sheet);box-shadow:0 0 0 1px var(--rule2);border-radius:4px;margin-bottom:16px}
.report div{padding:10px 8px;text-align:center}
.report div+div{border-left:1px solid var(--rule)}
.report b{display:block;font-family:"DotGothic16",monospace;font-weight:400;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.report span{font-size:11px;color:var(--sub)}
.filters{display:grid;gap:10px;margin-bottom:16px}
.fl>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tab{flex:none;min-height:38px;padding:0 13px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--rule2);font-size:14px;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none;font-weight:700}
.empty{background:var(--sheet);box-shadow:0 0 0 1px var(--rule2);border-radius:4px;padding:28px 18px;text-align:center;color:var(--sub)}

/* versus */
.panel{background:var(--sheet);box-shadow:0 0 0 1px var(--rule2);border-radius:4px;padding:16px 14px;margin-bottom:12px}
.panel h2{font-size:16px;margin:0 0 10px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.rules div{background:var(--sheet);box-shadow:0 0 0 1px var(--rule2);border-radius:4px;padding:10px 6px;text-align:center;font-size:12px;color:var(--sub);line-height:1.4}
.rules b{display:block;font-family:"DotGothic16",monospace;font-weight:400;font-size:22px;color:var(--ink)}
.rules .g b{color:var(--ok)} .rules .r b{color:var(--cr)}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--sub)}
.field input{min-width:0;width:100%;font:inherit;font-size:17px;padding:10px 12px;border:0;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--rule2);background:var(--paper);color:var(--ink)}
.codein{font-family:"DotGothic16",monospace!important;font-size:30px!important;letter-spacing:.5em;text-align:center;padding-left:.5em!important}
.or{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--rule2)}
.note{font-size:13px;color:var(--sub);margin:10px 0 0}
.lobby{padding:18px 14px 0;text-align:center}
.codebox{display:flex;justify-content:center;gap:8px;margin:8px 0 6px}
.codebox span{width:52px;height:64px;display:grid;place-items:center;font-family:"DotGothic16",monospace;font-size:40px;background:var(--winbg);border:3px solid var(--wink);border-radius:6px;box-shadow:0 0 0 3px var(--winbg)}
.lobby p{font-size:13px;color:#C3CAE6;margin:6px 0 0}
.plates{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.plate{font-family:"DotGothic16",monospace;font-size:16px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate small{display:block;font-size:12px;color:#AEB6D6}
.plate.wait{color:#7F88AE}
.vs{font-family:"DotGothic16",monospace;font-size:26px;color:#F3CF63;text-shadow:2px 2px 0 #C43D28}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.duel .who{font-size:14px}
.duel .hp{margin-bottom:4px}
.duel .meta{font-size:12px;color:#AEB6D6;font-variant-numeric:tabular-nums}
.count{font-family:"DotGothic16",monospace;font-size:96px;text-align:center;color:#FFF3CF;text-shadow:4px 4px 0 #C43D28,8px 8px 0 #05070E;line-height:1.3;padding:30px 0 10px}
.vend{text-align:center;padding:20px 14px}
.vend .big{font-family:"DotGothic16",monospace;font-size:36px;line-height:1.3}

@media (prefers-reduced-motion: reduce){
  .bob,.hit,.down,.hurt,.flash::after,.pop,.banner,.stamp,.msg::after{animation:none!important}
  .hp i,.btn,.sheet,.sheet-ov{transition:none}
}

function optionsFor(q,rnd){
  const need=new Set([...q.dr,...q.cr].map(x=>x.a));
  const pool=shuffle(ACC.filter(a=>!need.has(a)),rnd);
  while(need.size<8&&pool.length) need.add(pool.pop());
  return [...need].sort((a,b)=>ACC.indexOf(a)-ACC.indexOf(b));
}

/* 金額の選択肢：文中の数字・差し引き額・割合や年数での計算ミスを混ぜる */
function amountOptions(q,rnd){
  const ans=[...new Set([...q.dr,...q.cr].map(x=>x.n))];
  const txt=[];q.text.replace(/(\d[\d,]*)\s*円/g,(m,x)=>{txt.push(+x.replace(/,/g,""))});
  const pct=[];q.text.replace(/(\d+(?:\.\d+)?)\s*%/g,(m,x)=>{pct.push(+x)});
  const yrs=[];q.text.replace(/耐用年数\s*(\d+)\s*年/g,(m,x)=>{yrs.push(+x)});
  const mon=[];q.text.replace(/(\d+)\s*か月/g,(m,x)=>{mon.push(+x)});
  const score=new Map();
  const ok=n=>Number.isInteger(n)&&n>0&&n<1e10;
  const tidy=n=>n<100?false:n<1000?n%10===0:n%100===0;
  const add=(n,sc)=>{n=Math.round(n);if(!ok(n)||!tidy(n)||ans.includes(n))return;score.set(n,Math.max(score.get(n)||0,sc+rnd()*.9))};
  txt.forEach(n=>add(n,5));
  const base=[...new Set([...txt,...ans])];
  for(let i=0;i<base.length;i++)for(let j=i+1;j<base.length;j++){add(base[i]+base[j],3);add(Math.abs(base[i]-base[j]),4)}
  txt.forEach(n=>{
    pct.forEach(p=>{const v=n*p/100;add(v,4);ans.forEach(a=>{add(v+a,2);add(Math.abs(v-a),2)})});
    yrs.forEach(y=>{add(n/y,4);add(n*0.9/y,3);mon.forEach(m=>{add(n/y*m/12,3);add(n/y*(12-m)/12,4)})});
  });
  ans.forEach(a=>{add(a*2,1);add(a/2,1);add(a*1.2,1);add(a*0.8,1);add(a*10,.5);add(a/10,.5)});
  const WANT=8;
  const extra=[...score.entries()].sort((x,y)=>y[1]-x[1]).map(x=>x[0]).slice(0,Math.max(0,WANT-ans.length));
  return [...ans,...extra].sort((a,b)=>a-b);
}

  function finish(forced){

      <h3>ポイント</h3><p class="exp">${esc(q.exp)}</p></div><div class="next" data-next></div>`;
    onDone(ok,res.querySelector("[data-next]"));
    const hd=document.querySelector(".bhead"),jt=host.querySelector(".jt");

  }
  host.querySelector("[data-submit]").addEventListener("click",()=>finish(false));
  return {timeout:()=>finish(true),isDone:()=>done};
}

function pickLevel(w){const ks=Object.keys(w);let t=ks.reduce((x,k)=>x+w[k],0)*Math.random();for(const k of ks){t-=w[k];if(t<0)return +k}return +ks[0]}
function nextFor(e){
  const lv=pickLevel(e.w);
  const inCat=Q.filter(q=>q.cat===e.cat);
  let pool=inCat.filter(q=>q.lv===lv&&!S.used.has(q.id));
  if(!pool.length)pool=inCat.filter(q=>e.w[q.lv]&&!S.used.has(q.id));
  if(!pool.length){inCat.forEach(q=>S.used.delete(q.id));pool=inCat.filter(q=>e.w[q.lv])}
  const q=pool[Math.floor(Math.random()*pool.length)];S.used.add(q.id);return q;
}

  const e=S.enemy, last=S.stage===4;
  stopTimer();closePicker();
  if(!last){S.stage++;stageStart();scrollTo({top:0});return}
  setMsg(`${e.name}との戦いを終了した。`);
  const q=$("#q");q.innerHTML=`<section class="panel vend"><div class="big">おつかれさま</div><p class="note">最後まで戦うと、全ステージクリアが記録されます。</p><div class="next" id="ea"></div></section>`;
  $("#ea").append(btn("ホームへ",home,"btn ghost"),btn("もう一度挑戦する",soloStart));
  $("#skip").disabled=true;
}
function drawHp(){const e=S.enemy;setHp($("#ehp"),S.ehp/e.hp);$("#ehpT").textContent=`${S.ehp}/${e.hp}`;setHp($("#php"),S.php/100);$("#phpT").textContent=`HP ${S.php}`}
function setMsg(t){const m=$("#msg");if(m)m.textContent=t}
function soloQ(){
  const q=nextFor(S.enemy); const TL=timeFor(S.enemy); let left=TL;
  const ctl=renderQuestion($("#q"),q,Math.random,(ok,next)=>{
    stopTimer();
    const e=S.enemy;
    if(ok){
      const dmg=10+q.lv*10+(TL?Math.round(20*left/TL):10);
      S.ehp=Math.max(0,S.ehp-dmg);
      replay($("#foe"),"hit");pop(String(dmg),q.lv===3?"crit":"");
      setMsg(`${q.lv===3?"会心の仕訳！ ":"正しい仕訳！ "}${e.name}に${dmg}のダメージ！`);
    }else{
      S.php=Math.max(0,S.php-e.atk);
      replay($("#arena"),"hurt");replay($("#arena"),"flash");pop("-"+e.atk,"me");
      setMsg(`${e.name}のこうげき！ あなたは${e.atk}のダメージをうけた。`);
    }
    drawHp();
    if(S.ehp<=0){
      store.set("bestStage",Math.max(store.get("bestStage",0),S.stage+1));
      $("#foe").classList.add("down");
      if(S.stage===4){banner("全ステージクリア");setMsg(`${e.name}をたおした！ 帳簿はきれいに締まった。`);next.append(btn("ホームへ",home,"btn ghost"),btn("もう一度挑戦する",soloStart))}
      else{banner("ステージクリア");setMsg(`${e.name}をたおした！ HPが20回復する。`);next.append(btn("次のステージへ進む",()=>{S.stage++;S.php=Math.min(100,S.php+20);stageStart();scrollTo({top:0})}))}
    }else if(S.php<=0){
      banner("ゲームオーバー");setMsg("あなたはたおれてしまった……");next.append(btn("ホームへ",home,"btn ghost"),btn("ステージ1から挑戦する",soloStart));
    }else next.append(btn("次の問題へ",()=>{soloQ();scrollTo({top:0})}));
    next.lastChild.focus({preventScroll:true});
  });
  if(!TL){$("#clk").innerHTML='<span>のこり</span><span class="nolimit">制限なし</span>';return}
  const tm=$("#tm"),tt=$("#tmT");tm.style.width="100%";tm.classList.remove("low");tt.textContent=TL;
  timerId=setInterval(()=>{left-=.25;tm.style.width=Math.max(0,left/TL*100)+"%";tm.classList.toggle("low",left/TL<.25);tt.textContent=Math.max(0,Math.ceil(left));if(left<=0){stopTimer();ctl.timeout()}},250);
}

/* ---------- endless ---------- */
function endless(){
  stopTimer();
  let cat=store.get("endCat","all");
  let lvSel=store.get("endLv","all");
  const st=()=>store.get("stats",{n:0,ok:0,streak:0,best:0,miss:[]});
  function pick(){
    const s=st();let pool=Q;
    if(cat==="miss")pool=Q.filter(q=>s.miss.includes(q.id));
    else if(cat!=="all")pool=Q.filter(q=>q.cat===cat);
    if(lvSel!=="all")pool=pool.filter(q=>q.lv===+lvSel);
    return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  }
  function draw(){
    const s=st();
    const chips=[["all","すべて"],...Object.entries(CATS),["miss",`苦手 ${s.miss.length}問`]];
    app.innerHTML=`<nav class="topnav"><button class="back" id="bk">ホームへ戻る</button></nav>
    <header class="pagehead"><h1>とことんモード</h1><p>分野と難易度をしぼって、何問でも解ける。間違えた問題は「苦手」に集まる。</p></header>
    <section class="report" aria-label="成績"><div><b>${s.n?Math.round(s.ok/s.n*100):0}%</b><span>正答率</span></div><div><b>${s.n}</b><span>解いた数</span></div><div><b>${s.streak}</b><span>連続正解</span></div><div><b>${s.best}</b><span>最高連続</span></div></section>
    <div class="filters">
      <div class="fl"><span>出題範囲</span><div class="tabs" role="group" aria-label="出題範囲">${chips.map(([k,l])=>`<button class="tab" data-c="${k}" aria-pressed="${k===cat}">${esc(l)}</button>`).join("")}</div></div>
      <div class="fl"><span>難易度</span><div class="tabs" role="group" aria-label="難易度">${[["all","すべて"],["1","★ 基本"],["2","★★ 標準"],["3","★★★ 応用"]].map(([k,l])=>`<button class="tab" data-l="${k}" aria-pressed="${k===String(lvSel)}">${l}</button>`).join("")}</div></div>
    </div><div id="q"></div>`;
    $("#bk").onclick=home;
    app.querySelectorAll(".tab[data-c]").forEach(c=>c.onclick=()=>{cat=c.dataset.c;store.set("endCat",cat);draw()});
    app.querySelectorAll(".tab[data-l]").forEach(c=>c.onclick=()=>{lvSel=c.dataset.l;store.set("endLv",lvSel);draw()});
    const on=app.querySelector('.tab[aria-pressed="true"]');if(on)on.scrollIntoView({inline:"nearest",block:"nearest"});
    const q=pick();
    if(!q){$("#q").innerHTML=`<div class="empty">${cat==="miss"&&!s.miss.length?"苦手な問題はまだありません。間違えた問題がここに集まります。":"この組み合わせの問題はありません。出題範囲か難易度を変えてください。"}</div>`;return}
    renderQuestion($("#q"),q,Math.random,(ok,next)=>{
      const s=st();s.n++;
      if(ok){s.ok++;s.streak++;s.best=Math.max(s.best,s.streak);s.miss=s.miss.filter(i=>i!==q.id)}
      else{s.streak=0;if(!s.miss.includes(q.id))s.miss.push(q.id)}
      store.set("stats",s);
      const r=app.querySelectorAll(".report b");r[0].textContent=Math.round(s.ok/s.n*100)+"%";r[1].textContent=s.n;r[2].textContent=s.streak;r[3].textContent=s.best;
      next.append(btn("次の問題へ",()=>{draw();scrollTo({top:0})}));next.lastChild.focus({preventScroll:true});
    });
  }
  draw();
}

/* ---------- versus (PeerJS / WebRTC) ---------- */
const VQ=10, VHP=100, HIT=20, MISS=10;
let V=null;
const rand4=()=>String(Math.floor(1000+Math.random()*9000));
function leaveVersus(){if(V){try{V.conn&&V.conn.close()}catch(e){}try{V.peer&&V.peer.destroy()}catch(e){}}V=null}
function versusHome(){
  stopTimer();leaveVersus();
  const nick=store.get("nick","");
  app.innerHTML=`<nav class="topnav"><button class="back" id="bk">ホームへ戻る</button></nav>
  <header class="pagehead"><h1>ふたりでモード</h1><p>同じ${VQ}問を同時に解いて、先に相手のHPを0にしたほうの勝ち。</p></header>
  <div class="rules"><div><b>${VQ}</b>問で勝負</div><div class="g"><b>−${HIT}</b>正解で相手のHP</div><div class="r"><b>−${MISS}</b>ミスで自分のHP</div></div>
  <section class="panel">
    <div class="field"><label for="nk">ニックネーム</label><input id="nk" maxlength="12" value="${esc(nick)}" placeholder="例：しわけ太郎"></div>
    <div style="margin-top:14px"><button class="btn wide" id="mk">部屋をつくる</button></div>
    <div class="or">部屋番号をもらったら</div>
    <div class="field"><label for="cd">部屋番号（4桁）</label><input id="cd" class="codein" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000"></div>
    <div style="margin-top:12px"><button class="btn ghost wide" id="jn">部屋に入る</button></div>
    <p class="note" id="vs" aria-live="polite"></p>
  </section>`;
  $("#bk").onclick=home;
  const status=t=>{const el=$("#vs");if(el)el.textContent=t};
  if(typeof Peer==="undefined"){status("対戦用の通信ライブラリを読み込めませんでした。ネット接続を確認して再読み込みしてください。");$("#mk").disabled=$("#jn").disabled=true;return}
  status("相手にこのページのURLと部屋番号を伝えると、一緒に遊べます。");
  const nk=()=>{const v=$("#nk").value.trim().slice(0,12)||"ななしの簿記家";store.set("nick",v);return v};
  $("#mk").onclick=()=>enterRoom(rand4(),"host",nk());
  $("#jn").onclick=()=>{const c=$("#cd").value.replace(/\D/g,"");if(c.length!==4){status("部屋番号は4桁の数字で入力してください。");return}enterRoom(c,"guest",nk())};
}
function enterRoom(code,role,nick){
  leaveVersus();
  V={code,role,nick,round:0,seed:0,phase:"lobby",correct:0,wrong:0,idx:0,done:false,opp:null,ended:false,conn:null};
  const me=V;
  const peer=role==="host"?new Peer("boki3-"+code):new Peer();
  V.peer=peer;
  drawLobby();
  peer.on("open",()=>{if(V!==me)return;if(role==="guest")attach(peer.connect("boki3-"+code,{reliable:true}))});
  peer.on("connection",c=>{
    if(V!==me)return;
    if(V.conn&&V.conn.open){c.on("open",()=>{c.send({t:"full"});setTimeout(()=>c.close(),300)});return}
    attach(c);
  });
  peer.on("error",err=>{
    if(V!==me)return;
    if(err.type==="unavailable-id"){enterRoom(rand4(),"host",nick);return}
    if(err.type==="peer-unavailable"){alert("部屋が見つかりません。番号が正しいか、ホストが部屋をつくっているか確認してください。");versusHome();return}
    if(err.type==="network"||err.type==="server-error"||err.type==="socket-error"){alert("通信サーバーにつながりません。時間をおいてもう一度試してください。");versusHome()}
  });
}
function attach(c){
  const me=V;V.conn=c;
  c.on("open",()=>{if(V===me){pushP();onState()}});
  c.on("data",d=>{
    if(V!==me||!d||typeof d!=="object")return;
    if(d.t==="full"){alert("この部屋はすでに2人そろっています。");versusHome();return}
    if(d.t==="p"){V.opp={presence:{nick:String(d.nick||"相手").slice(0,12),role:d.role,round:+d.round||0,seed:+d.seed||0,phase:String(d.phase),correct:+d.correct||0,wrong:+d.wrong||0,idx:+d.idx||0,done:!!d.done}};onState()}
  });
  c.on("close",()=>{if(V!==me)return;V.opp=null;V.conn=null;onState()});
}
function pushP(){if(!V||!V.conn||!V.conn.open)return;try{V.conn.send({t:"p",nick:V.nick,role:V.role,round:V.round,seed:V.seed,phase:V.phase,correct:V.correct,wrong:V.wrong,idx:V.idx,done:V.done})}catch(e){}}
function oppStats(){const o=V.opp&&V.opp.presence;if(!o||o.round!==V.round)return{correct:0,wrong:0,idx:0,done:false};return{correct:o.correct,wrong:o.wrong,idx:o.idx,done:o.done}}
function onState(){
  if(!V)return;
  const o=V.opp&&V.opp.presence;
  if(V.role==="guest"&&o&&o.role==="host"&&o.phase==="play"&&o.round>V.round){V.round=o.round;V.seed=o.seed;beginMatch();return}
  if(V.phase==="lobby"||V.phase==="over")drawLobby();
  else updateDuel();
}
function drawLobby(){
  if(!V)return;
  const opp=V.opp?V.opp.presence.nick:null;
  if(V.phase==="over"&&$("#duel"))return;
  app.innerHTML=`<nav class="topnav"><button class="back" id="bk">部屋から出る</button></nav>
  <section class="stage">
    <div class="sky lobby"><p>部屋番号</p><div class="codebox" aria-label="部屋番号 ${esc(V.code)}">${[...V.code].map(d=>`<span>${d}</span>`).join("")}</div>
      <p>${V.role==="host"?"この番号を相手に伝えよう":"ホストの部屋に入りました"}</p><div style="height:18px"></div></div>
    <div class="ground"></div>
    <div class="win"><div class="plates"><div class="plate"><small>あなた</small><span id="mynm"></span></div><div class="vs">VS</div><div class="plate${opp?"":" wait"}"><small>相手</small><span id="on"></span></div></div></div>
    <div class="win msg" id="la" aria-live="polite"></div>
  </section><div id="lact"></div>`;
  $("#mynm").textContent=V.nick;
  $("#on").textContent=opp||"待っています…";
  $("#bk").onclick=versusHome;
  if(V.role==="host"){
    $("#la").textContent=opp?`${opp}が来た！ 準備ができたら始めよう。`:"相手が部屋に入るのを待っています…";
    const b=btn("対戦をはじめる",startMatch,"btn wide");b.disabled=!opp;$("#lact").append(b);
  }else $("#la").textContent=opp?"ホストが対戦を始めるのを待っています…":"部屋に接続しています…";
}
function startMatch(){V.round++;V.seed=Math.floor(Math.random()*1e9);beginMatch()}
function beginMatch(){
  V.phase="play";V.correct=V.wrong=V.idx=0;V.done=false;V.ended=false;
  V.qs=shuffle(Q,rngOf(V.seed)).slice(0,VQ);
  pushP();
  let n=3;
  app.innerHTML=`<section class="stage"><div class="sky"><div class="count" id="cd" aria-live="assertive">3</div><p class="px" style="text-align:center;margin:0;padding-bottom:22px;color:#C3CAE6">同じ問題で勝負！</p></div><div class="ground"></div></section>`;
  const t=setInterval(()=>{n--;const el=$("#cd");if(!el){clearInterval(t);return}if(n>0)el.textContent=n;else{clearInterval(t);drawDuel();vsQ()}},800);
}
const hpOf=(myWrong,oppCorrect)=>Math.max(0,VHP-oppCorrect*HIT-myWrong*MISS);
function drawDuel(){
  app.innerHTML=`<section class="bhead sky" id="duel">
    <div class="bh-top"><button class="back" id="bk">退出</button><span class="grow px" id="qc"></span><span class="px">部屋 ${esc(V.code)}</span></div>
    <div class="duel">
      <div><div class="who"><span id="mn"></span></div><div class="hp"><i id="mh"></i></div><div class="meta" id="mt"></div></div>
      <div class="vs">VS</div>
      <div><div class="who"><span id="onm"></span></div><div class="hp"><i id="oh"></i></div><div class="meta" id="ot"></div></div>
    </div>
    <div class="msg" id="msg" aria-live="polite">勝負開始！</div>
    <div class="fx" id="fx"></div>
  </section><div id="q"></div>`;
  $("#bk").onclick=versusHome;
  $("#mn").textContent=V.nick;
  updateDuel();
}
function updateDuel(){
  if(!V||!$("#duel"))return;
  const o=oppStats();
  const mh=hpOf(V.wrong,o.correct), oh=hpOf(o.wrong,V.correct);
  const prev=V.lastHp||{mh:VHP,oh:VHP};
  if(mh<prev.mh&&o.correct>(V.lastOppC||0)){replay($("#duel"),"flash");pop("-"+(prev.mh-mh),"me")}
  V.lastHp={mh,oh};V.lastOppC=o.correct;
  $("#onm").textContent=V.opp?String(V.opp.presence.nick).slice(0,12):"相手が退出しました";
  setHp($("#mh"),mh/VHP);setHp($("#oh"),oh/VHP);
  $("#mt").textContent=`HP ${mh}　${V.idx}/${VQ}問`;$("#ot").textContent=`HP ${oh}　${o.idx}/${VQ}問`;
  $("#qc").textContent=`第${Math.min(V.idx+1,VQ)}問 / ${VQ}`;
  if(V.ended)return;
  const finished=mh<=0||oh<=0||(V.done&&o.done)||(!V.opp&&V.idx>0);
  if(finished)endMatch(mh,oh);
  else if(V.done)$("#msg").textContent="全問解き終わった。相手を待っています…";
}
function vsQ(){
  if(!V||V.ended)return;
  if(V.idx>=VQ){V.done=true;pushP();$("#q").innerHTML="";updateDuel();return}
  const q=V.qs[V.idx];
  renderQuestion($("#q"),q,rngOf(V.seed+V.idx*7919),(ok,next)=>{
    if(ok){V.correct++;$("#msg").textContent=`正解！ 相手に${HIT}のダメージ！`;pop(String(HIT),"opp")}
    else{V.wrong++;$("#msg").textContent=`不正解… 自分に${MISS}のダメージ。`;replay($("#duel"),"hurt");pop("-"+MISS,"me")}
    V.idx++;if(V.idx>=VQ)V.done=true;pushP();updateDuel();
    if(!V.ended){next.append(btn(V.idx>=VQ?"結果を待つ":"次の問題へ",()=>{vsQ();scrollTo({top:0})}));next.lastChild.focus({preventScroll:true})}
  });
}
function endMatch(mh,oh){
  V.ended=true;V.phase="over";V.done=true;pushP();closePicker();
  const res=mh===oh?"ひきわけ":mh>oh?"あなたの勝ち！":"あなたの負け…";
  banner(mh===oh?"ひきわけ":mh>oh?"勝利":"敗北");
  $("#msg").textContent=`${res}　あなた HP ${mh}　相手 HP ${oh}`;
  const q=$("#q");q.innerHTML=`<section class="panel vend"><div class="big">${esc(res)}</div><div class="next" id="ea"></div></section>`;
  const ea=$("#ea");
  ea.append(btn("部屋から出る",versusHome,"btn ghost"));
  if(V.role==="host")ea.append(btn("もう一度対戦する",()=>{V.lastHp=null;V.lastOppC=0;startMatch()}));
  else{const p=document.createElement("p");p.className="note";p.style.width="100%";p.textContent="ホストが「もう一度対戦する」を押すと次の対戦が始まります。";ea.append(p);V.lastHp=null;V.lastOppC=0}
}

new MutationObserver(()=>document.body.classList.toggle("battle",!!document.querySelector(".bhead"))).observe(app,{childList:true});
home();

</script>
</body>
